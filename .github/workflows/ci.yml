name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .gitlab-ci
          file: .gitlab-ci/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prepare:
    needs: docker
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user 1001
    strategy:
      matrix:
        board: [mox, omnia, turris1x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare
        run: |
          ./compile_pkgs -t "${{ matrix.board }}" prepare

  medkit:
    needs: [docker, prepare]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user 1001
    strategy:
      matrix:
        board: [mox, omnia, turris1x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate Medkit
        run: |
          ./generate_medkits -t "${{ matrix.board }}" $(. defaults.sh && [ "$PUBLISH_BRANCH" = "hbs" ] && echo -b hbk)
          [ -f "generated_medkits/${{ matrix.board }}-medkit-latest.tar.gz" ]
          [ -f "generated_medkits/${{ matrix.board }}-medkit-min-latest.tar.gz" ]
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Medkit ${{ matrix.board }}
          path: generated_medkits/*

  lists_generate:
    needs: docker
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
      options: --user 1001
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate lists
        run: ./generate_lists --debug
      - name: Archive lists
        run: tar -czf updater-lists.tar.gz -C generated_lists .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Generated package lists
          path: updater-lists.tar.gz
          
  release:
    needs: [medkit, lists_generate]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
