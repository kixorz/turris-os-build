name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .gitlab-ci/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_package:
    needs: docker
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        board: [mox, omnia, turris1x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare Tools
        run: |
          ./compile_pkgs prepare_tools -t "${{ matrix.board }}"
      - name: Build Package
        run: |
          # TODO build
          # make package/hostlog/compile

  build_packages:
    if: false
    needs: docker
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        board: [ mox, omnia, turris1x ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Packages
        run: |
          ./compile_pkgs -t "${{ matrix.board }}"

  generate_lists:
    if: false
    needs: docker
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate lists
        run: |
          ./generate_lists --debug
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Generated package lists
          path: generated_lists/*
